# Penna production nginx config (Windows).
# Copied to <nginx>\conf\nginx.conf by deploy\install-services.ps1.
#
# Internet -> router(80/443) -> Nginx Proxy Manager (HTTPS, 192.168.0.33)
#          -> this nginx (:8124) -> php-cgi workers (127.0.0.1:9101, 9102) -> MySQL (192.168.0.27)

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # php-cgi on Windows handles one request at a time, so run a few and balance between them.
    upstream penna_php {
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    server {
        listen       8124;
        server_name  _;

        root   G:/penna/public;
        index  index.php;
        charset utf-8;

        # Up to 5 attachments of 10MB each in one Livewire upload request.
        client_max_body_size 60m;

        access_log  logs/penna.access.log;
        error_log   logs/penna.error.log;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Built assets and uploaded public files (avatars, notice images) never run as PHP.
        location ~ ^/(build|storage|css|js|fonts)/ {
            try_files $uri =404;
            expires 7d;
            access_log off;
        }

        location = /index.php {
            fastcgi_pass   penna_php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        # Any other .php file and dotfiles (.env, .git) are never served.
        location ~ \.php$ { return 404; }
        location ~ /\.(?!well-known) { deny all; }
    }
}
